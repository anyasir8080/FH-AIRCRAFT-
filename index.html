<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLEET FH & FC</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#edf5f1;margin:0;padding:20px;color:#164b39}
header{background:#086448;color:white;padding:24px;border-radius:15px}
section{background:white;padding:20px;margin-top:20px;border-radius:15px}
table{width:100%;border-collapse:collapse}
td,th{padding:14px 6px;text-align:center;border-bottom:1px solid #ddd}
input,select,button{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#086448;color:white;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#status{min-height:1.5em}.error{color:#b42318}.success{color:#086448}
</style>
</head>
<body>
<header><small>IRAQI AIRWAYS</small><h1>FLEET FH & FC</h1><p>Continuing Airworthiness Management</p></header>
<section>
<h2>Fleet Overview</h2>
<table><thead><tr><th>Aircraft</th><th>FH</th><th>FC</th></tr></thead><tbody id="fleet"><tr><td colspan="3">Loading...</td></tr></tbody></table>
<button type="button" id="refresh">Refresh Fleet Data</button>
<p id="status" role="status"></p>
</section>
<section>
<h2>Fleet Editor Sign-in</h2>
<form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button></form>
<button id="logout" type="button" hidden>Sign out</button><p id="login-status" role="status"></p>
</section>
<section>
<h2>Update Utilization</h2>
<form id="update">
<label for="aircraft">Aircraft</label><select id="aircraft" required></select>
<label for="fh">Additional FH</label><input id="fh" type="number" min="0" step="0.01" required>
<label for="fc">Additional FC</label><input id="fc" type="number" min="0" step="1" required>
<button id="submit" type="submit" disabled>Update Aircraft</button>
</form>
</section>
<section>
<h2>Add New Aircraft</h2>
<form id="add-aircraft">
<label for="new-aircraft">Aircraft Registration</label>
<input id="new-aircraft" type="text" maxlength="20" placeholder="YI-ABC" autocapitalize="characters" required>
<label for="initial-fh">Initial FH</label>
<input id="initial-fh" type="number" min="0" step="0.01" value="0" required>
<label for="initial-fc">Initial FC</label>
<input id="initial-fc" type="number" min="0" step="1" value="0" required>
<button id="add-submit" type="submit" disabled>Add Aircraft</button>
<p id="add-status" role="status"></p>
</form>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://jlyizhbwjupczzsxvzaf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_ccIV5Gkbjg2y5oMd90mMeg_-5bKNRCb';
const fleetBody=document.getElementById('fleet');
const aircraftSelect=document.getElementById('aircraft');
const statusEl=document.getElementById('status');
const form=document.getElementById('update');
const submitBtn=document.getElementById('submit');
let db, canWrite=false, savingUpdate=false, savingAircraft=false;
const login=document.getElementById('login');
const logout=document.getElementById('logout');
const loginStatus=document.getElementById('login-status');
const addButton=document.getElementById('add-submit');
function renderWriteControls(){
 submitBtn.disabled=!canWrite||savingUpdate;
 addButton.disabled=!canWrite||savingAircraft;
}
function showSession(session){
 canWrite=session?.user?.app_metadata?.fleet_writer===true && session.user.is_anonymous!==true;
 login.hidden=Boolean(session);
 logout.hidden=!session;
 loginStatus.textContent=canWrite?'Signed in as fleet editor.':session?'This account has read-only access.':'Sign in with an authorized account to edit the fleet.';
 renderWriteControls();
}
login.addEventListener('submit',async event=>{
 event.preventDefault();
 const button=login.querySelector('button');
 button.disabled=true;
 try{
  const {error}=await db.auth.signInWithPassword({email:login.elements.email.value.trim(),password:login.elements.password.value});
  if(error)throw error;
  login.reset();
 }catch(error){loginStatus.textContent='Sign-in failed: '+error.message}
 finally{button.disabled=false}
});
logout.addEventListener('click',async ()=>{
 try{
  const {error}=await db.auth.signOut({scope:'local'});
  if(error)throw error;
 }catch(error){loginStatus.textContent='Sign-out failed: '+error.message}
});
function status(message,isError=false){statusEl.textContent=message;statusEl.className=isError?'error':'success'}
async function loadFleet(){
 status('Loading fleet data...');
 try{
  if(!db)throw new Error('Supabase library unavailable');
  const {data,error}=await db.from('fleet').select('aircraft,fh,fc,updated_at').order('aircraft');
  if(error)throw error;
  const selected=aircraftSelect.value;
  fleetBody.replaceChildren();aircraftSelect.replaceChildren();
  for(const a of data||[]){
   const tr=document.createElement('tr');
   for(const value of [a.aircraft,Number(a.fh).toFixed(2),a.fc]){
    const td=document.createElement('td');td.textContent=value;tr.appendChild(td);
   }
   fleetBody.appendChild(tr);
   const option=document.createElement('option');option.value=a.aircraft;option.textContent=a.aircraft;aircraftSelect.appendChild(option);
  }
  if(data?.some(row=>row.aircraft===selected))aircraftSelect.value=selected;
  if(!data?.length)fleetBody.innerHTML='<tr><td colspan="3">No aircraft found</td></tr>';
  status('Fleet data loaded successfully.');
 }catch(err){
  fleetBody.innerHTML='<tr><td colspan="3">Unable to load data</td></tr>';
  status('Unable to load fleet: '+err.message,true);
 }
}
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const aircraft=aircraftSelect.value;
 const fhText=document.getElementById('fh').value;
 const fcText=document.getElementById('fc').value;
 const addFH=Number(fhText),addFC=Number(fcText);
 if(!aircraft||!/^\d+(\.\d{1,2})?$/.test(fhText)||!/^\d+$/.test(fcText)||!Number.isSafeInteger(addFC)||(addFH===0&&addFC===0)){
  status('Enter valid additional FH (up to 2 decimals) and whole FC.',true);return;
 }
 if(!canWrite||savingUpdate)return;
 savingUpdate=true;renderWriteControls();status('Saving update...');
 try{
  const {error}=await db.rpc('add_fleet_utilization',{p_aircraft_id:aircraft,p_fh:addFH,p_fc:addFC});
  if(error)throw error;
  form.reset();await loadFleet();
  if(!statusEl.classList.contains('error'))status('Aircraft utilization updated successfully.');
 }catch(err){status('Update failed: '+err.message,true)}
 finally{savingUpdate=false;renderWriteControls()}
});
document.getElementById('add-aircraft').addEventListener('submit',async e=>{
 e.preventDefault();
 const registration=document.getElementById('new-aircraft').value.trim().toUpperCase();
 const fhText=document.getElementById('initial-fh').value;
 const fcText=document.getElementById('initial-fc').value;
 const addStatus=document.getElementById('add-status');
 const show=(message,error=false)=>{addStatus.textContent=message;addStatus.className=error?'error':'success'};
 if(!/^[A-Z0-9]+(?:-[A-Z0-9]+)*$/.test(registration)||
    !/^\d+(\.\d{1,2})?$/.test(fhText)||
    !/^\d+$/.test(fcText)||
    !Number.isSafeInteger(Number(fcText))){
  show('Enter a valid registration, FH (maximum 2 decimals), and whole FC.',true);return;
 }
 if(!canWrite||savingAircraft)return;
 savingAircraft=true;renderWriteControls();show('Adding aircraft...');
 try{
  if(!db)throw new Error('Supabase connection unavailable');
  const {data:existing,error:lookupError}=await db.from('fleet')
    .select('aircraft').eq('aircraft',registration).limit(1);
  if(lookupError)throw lookupError;
  if(existing?.length)throw new Error('This aircraft already exists.');
  const {error}=await db.from('fleet').insert({
   aircraft:registration,fh:Number(fhText),fc:Number(fcText)
  });
  if(error){
   if(error.code==='23505')throw new Error('This aircraft already exists.');
   throw error;
  }
  e.target.reset();
  document.getElementById('initial-fh').value='0';
  document.getElementById('initial-fc').value='0';
  await loadFleet();
  if(statusEl.classList.contains('error'))throw new Error('Aircraft saved, but the fleet could not be refreshed.');
  show('Aircraft added successfully.');
 }catch(err){show('Unable to add aircraft: '+err.message,true)}
 finally{savingAircraft=false;renderWriteControls()}
});
document.getElementById('refresh').addEventListener('click',loadFleet);
try{
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{detectSessionInUrl:false}});
 db.auth.onAuthStateChange((_event,session)=>showSession(session));
 const refreshWhenIdle=()=>{if(!document.hidden&&!savingAircraft&&!savingUpdate)loadFleet()};
 window.addEventListener('focus',refreshWhenIdle);
 setInterval(refreshWhenIdle,30000);
}catch(err){status('Connection initialization failed: '+err.message,true)}
loadFleet();
</script>
</body>
</html>
